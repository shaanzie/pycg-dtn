version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# Install the package itself, so autodoc can import pycg_dtn
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - pdf
