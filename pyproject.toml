[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycg-dtn"
dynamic = ["version"]
description = "Build DTN contact graphs for deep-space networks from SPICE ephemerides"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ishaan Lagwankar", email = "lagwanka@msu.edu" }]
keywords = [
    "dtn",
    "contact-graph",
    "spice",
    "naif",
    "deep-space",
    "delay-tolerant-networking",
    "ion",
    "ephemeris",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: System :: Networking",
]
dependencies = [
    "numpy>=1.23",
    "spiceypy>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
pycg = "pycg_dtn.cli:main"

[project.urls]
Homepage = "https://github.com/shaanzie/pycg-dtn"
Repository = "https://github.com/shaanzie/pycg-dtn"
Issues = "https://github.com/shaanzie/pycg-dtn/issues"

[tool.hatch.version]
path = "src/pycg_dtn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pycg_dtn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that download kernels from NAIF (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
